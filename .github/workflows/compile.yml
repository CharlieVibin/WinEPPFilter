name: Build Windows KMDF Driver via GitHub Actions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Compile WinEPPFilter.sys & DiagnosticApp.exe
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Download & Link Official WDK Kernel Headers (ntddk.h, wdf.h)
        shell: powershell
        run: |
          # Install official WDK package via NuGet
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory D:\wdk_pkg
          
          $wdkInc = Get-ChildItem -Path "D:\wdk_pkg" -Recurse -Filter "ntddk.h" | Select-Object -First 1
          if ($wdkInc) {
            $kmDir = $wdkInc.Directory.FullName
            $sharedDir = (Join-Path (Split-Path $kmDir -Parent) "shared")
            $wdfDir = (Join-Path (Split-Path $kmDir -Parent) "wdf")
            Write-Host "Found ntddk.h at: $kmDir"
            
            # Export to GitHub Actions environment so MSBuild sees them
            echo "INCLUDE=$kmDir;$sharedDir;$wdfDir;${env:INCLUDE}" >> $env:GITHUB_ENV
          }

      - name: Build Driver & Diagnostic App (Release x64)
        shell: powershell
        run: |
          $sln = Get-ChildItem -Recurse -Filter "WinEPPFilter.sln" | Select-Object -First 1
          $targetSln = if ($sln) { $sln.FullName } else { "WinEPPFilter.sln" }

          Write-Host "Compiling solution at: $targetSln"
          msbuild $targetSln /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:InfVerif=false /p:EnableInf2cat=false /p:TreatWarningAsError=false /p:DriverTargetPlatform=Universal

      - name: Create Self-Signed Driver Package & Test Certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WinEPPFilter Test Certificate" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          
          # Find output directories
          $sysFiles = Get-ChildItem -Recurse -Filter "WinEPPFilter.sys"
          foreach ($sys in $sysFiles) {
            $destDir = $sys.DirectoryName
            Export-Certificate -Cert $certPath -FilePath "$destDir\WinEPPFilter.cer"
            Set-AuthenticodeSignature -Certificate (Get-Item $certPath) -FilePath $sys.FullName -HashAlgorithm SHA256
          }

      - name: Upload Compiled Driver Artifacts (.sys, .inf, .cer, DiagnosticApp.exe)
        uses: actions/upload-artifact@v4
        with:
          name: WinEPPFilter-x64-Compiled-Package
          path: |
            **/x64/Release/WinEPPFilter/WinEPPFilter.sys
            **/x64/Release/WinEPPFilter/WinEPPFilter.inf
            **/x64/Release/WinEPPFilter/WinEPPFilter.cer
            **/x64/Release/DiagnosticApp/DiagnosticApp.exe
            **/scripts/install.bat
            **/scripts/uninstall.bat
