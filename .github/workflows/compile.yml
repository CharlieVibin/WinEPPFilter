name: Build Windows KMDF Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build WinEPPFilter Driver
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Install WDK Package
        shell: powershell
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory packages

          $props = @(
            '<Project>',
            '  <PropertyGroup>',
            '    <WindowsTargetPlatformVersion Condition="' + "'" + '$(WindowsTargetPlatformVersion)' + "''" + '">10.0.26100.0</WindowsTargetPlatformVersion>',
            '    <TargetPlatformVersion Condition="' + "'" + '$(TargetPlatformVersion)' + "''" + '">10.0.26100.0</TargetPlatformVersion>',
            '    <WDKBinRoot Condition="Exists(' + "'" + '$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\bin\' + "'" + ')">$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\bin\</WDKBinRoot>',
            '  </PropertyGroup>',
            '  <ImportGroup Label="PropertySheets">',
            '    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.props" Condition="Exists(' + "'" + '$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.props' + "'" + ')" />',
            '    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.props" Condition="Exists(' + "'" + '$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.props' + "'" + ')" />',
            '  </ImportGroup>',
            '</Project>'
          )
          $props | Set-Content "Directory.Build.props"

          $targets = @(
            '<Project>',
            '  <ImportGroup Label="PropertySheets">',
            '    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.targets" Condition="Exists(' + "'" + '$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.targets' + "'" + ')" />',
            '    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.targets" Condition="Exists(' + "'" + '$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.targets' + "'" + ')" />',
            '  </ImportGroup>',
            '</Project>'
          )
          $targets | Set-Content "Directory.Build.targets"
          Write-Host "WDK props and targets created successfully."

      - name: Compile Solution
        shell: powershell
        run: |
          $sln = (Get-ChildItem -Recurse -Filter "WinEPPFilter.sln" | Select-Object -First 1).FullName
          if (-not $sln) { $sln = "WinEPPFilter.sln" }
          Write-Host "Building $sln..."
          msbuild $sln /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:DriverTargetPlatform=Universal /p:InfVerif=false /p:EnableInf2cat=false /p:TreatWarningAsError=false /v:m

      - name: Sign Driver
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WinEPPFilter Test" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          Get-ChildItem -Recurse -Filter "*.sys" | ForEach-Object {
            Set-AuthenticodeSignature -Certificate (Get-Item $certPath) -FilePath $_.FullName -HashAlgorithm SHA256
            Export-Certificate -Cert $certPath -FilePath (Join-Path $_.DirectoryName "WinEPPFilter.cer")
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinEPPFilter-x64-Compiled-Package
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cer
            **/x64/Release/**/DiagnosticApp.exe
            **/scripts/*.bat
