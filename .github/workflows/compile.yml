name: Build Windows KMDF Driver via GitHub Actions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Compile WinEPPFilter.sys & DiagnosticApp.exe
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore WDK & SDK NuGet Packages
        shell: powershell
        run: |
          # 1. Download official Microsoft WDK 10.0.26100 NuGet Package into packages folder
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory packages
          
          # 2. Write Directory.Build.props at repo root pointing MSBuild to WDK props & targets
          $b64 = ""
          [System.IO.File]::WriteAllBytes("Directory.Build.props", [System.Convert]::FromBase64String($b64))
          Write-Host "Created Directory.Build.props successfully."

      - name: Build Driver & Diagnostic App (Release x64)
        shell: powershell
        run: |
          # Detect the exact installed Windows SDK on this runner (e.g. 10.0.22621.0)
          $progFilesX86 = [System.Environment]::GetFolderPath([System.Environment+SpecialFolder]::ProgramFilesX86)
          $sdkPath = Join-Path $progFilesX86 "Windows Kits\10\Include"
          $installedSdk = (Get-ChildItem -Path $sdkPath -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1).Name
          if (-not $installedSdk) { $installedSdk = "10.0.22621.0" }
          Write-Host "Using Runner Installed Windows SDK: $installedSdk"

          $sln = Get-ChildItem -Recurse -Filter "WinEPPFilter.sln" | Select-Object -First 1
          $targetSln = if ($sln) { $sln.FullName } else { "WinEPPFilter.sln" }

          Write-Host "Compiling solution at: $targetSln"
          msbuild $targetSln /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:WindowsTargetPlatformVersion=$installedSdk /p:DriverTargetPlatform=Universal /p:InfVerif=false /p:EnableInf2cat=false /p:TreatWarningAsError=false

      - name: Create Self-Signed Driver Package & Test Certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WinEPPFilter Test Certificate" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          
          # Find output directories and sign .sys files
          $sysFiles = Get-ChildItem -Recurse -Filter "WinEPPFilter.sys"
          foreach ($sys in $sysFiles) {
            $destDir = $sys.DirectoryName
            Export-Certificate -Cert $certPath -FilePath "$destDir\WinEPPFilter.cer"
            Set-AuthenticodeSignature -Certificate (Get-Item $certPath) -FilePath $sys.FullName -HashAlgorithm SHA256
          }

      - name: Upload Compiled Driver Artifacts (.sys, .inf, .cer, DiagnosticApp.exe)
        uses: actions/upload-artifact@v4
        with:
          name: WinEPPFilter-x64-Compiled-Package
          path: |
            **/x64/Release/WinEPPFilter/WinEPPFilter.sys
            **/x64/Release/WinEPPFilter/WinEPPFilter.inf
            **/x64/Release/WinEPPFilter/WinEPPFilter.cer
            **/x64/Release/DiagnosticApp/DiagnosticApp.exe
            **/scripts/install.bat
            **/scripts/uninstall.bat
