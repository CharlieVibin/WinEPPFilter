name: Build Windows KMDF Driver via GitHub Actions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Compile WinEPPFilter.sys & DiagnosticApp.exe
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit (WDK)
        shell: powershell
        run: |
          Write-Host ">>> Step 1: Installing Official WDK via Winget..."
          try {
            winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --source winget --accept-package-agreements --accept-source-agreements --silent
            Write-Host "[OK] Winget WDK installed."
          } catch {
            Write-Host "[!] Winget install skipped or already satisfied."
          }

          Write-Host ">>> Step 2: Restoring WDK & SDK NuGet packages..."
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory packages
          
          # Configure Directory.Build.props
          $propsXml = @'
<Project>
  <PropertyGroup>
    <WindowsTargetPlatformVersion Condition="'$(WindowsTargetPlatformVersion)' == ''">10.0.26100.0</WindowsTargetPlatformVersion>
    <TargetPlatformVersion Condition="'$(TargetPlatformVersion)' == ''">10.0.26100.0</TargetPlatformVersion>
    <WDKBinRoot Condition="Exists('$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\bin\')">$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\bin\</WDKBinRoot>
  </PropertyGroup>
  <ImportGroup Label="PropertySheets">
    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.props" Condition="Exists('$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.props')" />
    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.props" Condition="Exists('$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.props')" />
  </ImportGroup>
</Project>
'@
          [System.IO.File]::WriteAllText("Directory.Build.props", $propsXml.Trim())

          # Configure Directory.Build.targets
          $targetsXml = @'
<Project>
  <ImportGroup Label="PropertySheets">
    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.targets" Condition="Exists('$(MSBuildThisFileDirectory)packages\Microsoft.Windows.SDK.cpp.10.0.26100.2454\build\native\Microsoft.Windows.SDK.cpp.targets')" />
    <Import Project="$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.targets" Condition="Exists('$(MSBuildThisFileDirectory)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\Microsoft.Windows.WDK.x64.targets')" />
  </ImportGroup>
</Project>
'@
          [System.IO.File]::WriteAllText("Directory.Build.targets", $targetsXml.Trim())
          Write-Host "[OK] WDK build environment configured."

      - name: Build Driver & Diagnostic App (Release x64)
        shell: powershell
        run: |
          $sln = Get-ChildItem -Recurse -Filter "WinEPPFilter.sln" | Select-Object -First 1
          $targetSln = if ($sln) { $sln.FullName } else { "WinEPPFilter.sln" }

          Write-Host "Compiling solution at: $targetSln"
          msbuild $targetSln /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:DriverTargetPlatform=Universal /p:InfVerif=false /p:EnableInf2cat=false /p:TreatWarningAsError=false /v:m

      - name: Create Self-Signed Driver Package & Test Certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WinEPPFilter Test Certificate" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          
          # Find output directories and sign .sys files
          $sysFiles = Get-ChildItem -Recurse -Filter "WinEPPFilter.sys"
          foreach ($sys in $sysFiles) {
            $destDir = $sys.DirectoryName
            Export-Certificate -Cert $certPath -FilePath "$destDir\WinEPPFilter.cer"
            Set-AuthenticodeSignature -Certificate (Get-Item $certPath) -FilePath $sys.FullName -HashAlgorithm SHA256
          }

      - name: Upload Compiled Driver Artifacts (.sys, .inf, .cer, DiagnosticApp.exe)
        uses: actions/upload-artifact@v4
        with:
          name: WinEPPFilter-x64-Compiled-Package
          path: |
            **/x64/Release/WinEPPFilter/WinEPPFilter.sys
            **/x64/Release/WinEPPFilter/WinEPPFilter.inf
            **/x64/Release/WinEPPFilter/WinEPPFilter.cer
            **/x64/Release/DiagnosticApp/DiagnosticApp.exe
            **/scripts/install.bat
            **/scripts/uninstall.bat
