name: Build Windows KMDF Driver via GitHub Actions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Compile WinEPPFilter.sys & DiagnosticApp.exe
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Download WDK & Build Solution
        shell: powershell
        run: |
          # 1. Download official Microsoft WDK 10.0.26100 package
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory D:\wdk_pkg
          
          # 2. Locate the unpacked WDK include & lib directories
          $wdkPkg = Get-ChildItem -Path "D:\wdk_pkg" -Filter "Microsoft.Windows.WDK.x64*" -Directory | Select-Object -First 1
          $wdkC = Join-Path $wdkPkg.FullName "c"
          $incBase = Join-Path $wdkC "Include\10.0.26100.0"
          $kmInc = Join-Path $incBase "km"
          $sharedInc = Join-Path $incBase "shared"
          $wdfInc = Join-Path $incBase "wdf\kmdf\1.15"
          $crtInc = Join-Path $incBase "km\crt"
          $libBase = Join-Path $wdkC "Lib\10.0.26100.0"
          $kmLib = Join-Path $libBase "km\x64"
          $wdfLib = Join-Path $libBase "wdf\kmdf\x64\1.15"

          Write-Host "KM Include Path: $kmInc"
          Write-Host "KM Lib Path: $kmLib"

          # 3. Locate the Solution file
          $sln = Get-ChildItem -Recurse -Filter "WinEPPFilter.sln" | Select-Object -First 1
          $targetSln = if ($sln) { $sln.FullName } else { "WinEPPFilter.sln" }

          # 4. Compile with MSBuild passing WDK directories
          Write-Host "Compiling solution at: $targetSln"
          & msbuild.exe $targetSln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:TargetVersion=Windows10 `
            /p:DriverTargetPlatform=Universal `
            /p:InfVerif=false `
            /p:EnableInf2cat=false `
            /p:TreatWarningAsError=false `
            /p:WDKContentRoot="$wdkC\" `
            "/p:IncludePath=$kmInc;$sharedInc;$wdfInc;$crtInc;$(Get-Content env:INCLUDE -ErrorAction SilentlyContinue)" `
            "/p:LibraryPath=$kmLib;$wdfLib;$(Get-Content env:LIB -ErrorAction SilentlyContinue)"

      - name: Create Self-Signed Driver Package & Test Certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WinEPPFilter Test Certificate" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          
          # Find output directories and sign .sys files
          $sysFiles = Get-ChildItem -Recurse -Filter "WinEPPFilter.sys"
          foreach ($sys in $sysFiles) {
            $destDir = $sys.DirectoryName
            Export-Certificate -Cert $certPath -FilePath "$destDir\WinEPPFilter.cer"
            Set-AuthenticodeSignature -Certificate (Get-Item $certPath) -FilePath $sys.FullName -HashAlgorithm SHA256
          }

      - name: Upload Compiled Driver Artifacts (.sys, .inf, .cer, DiagnosticApp.exe)
        uses: actions/upload-artifact@v4
        with:
          name: WinEPPFilter-x64-Compiled-Package
          path: |
            **/x64/Release/WinEPPFilter/WinEPPFilter.sys
            **/x64/Release/WinEPPFilter/WinEPPFilter.inf
            **/x64/Release/WinEPPFilter/WinEPPFilter.cer
            **/x64/Release/DiagnosticApp/DiagnosticApp.exe
            **/scripts/install.bat
            **/scripts/uninstall.bat
