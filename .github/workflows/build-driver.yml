name: Build Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    env:
      WINSDKVER: 10.0.22621.0

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Windows 11 SDK
      shell: powershell
      run: |
        Write-Host "Installing Windows 11 SDK..."
        winget install Microsoft.WindowsSDK.10.0.22621 -h --accept-source-agreements --accept-package-agreements
        
        $sdkPath = "C:\Program Files (x86)\Windows Kits\10"
        if (Test-Path $sdkPath) {
          Write-Host "✓ Windows SDK installed successfully at: $sdkPath"
          Get-ChildItem "$sdkPath\Include" | Select-Object Name
        } else {
          Write-Host "⚠ SDK path not found, checking alternative paths..."
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\" -ErrorAction SilentlyContinue | Select-Object Name
        }

    - name: Install Windows Driver Kit (WDK)
      shell: powershell
      run: |
        Write-Host "Installing Windows Driver Kit..."
        
        winget install Microsoft.WindowsDriverKit.10.0.22621 -h --accept-source-agreements --accept-package-agreements
        
        $wdkPath = "C:\Program Files (x86)\Windows Kits\10"
        if (Test-Path $wdkPath) {
          Write-Host "✓ WDK installed successfully"
          
          $ntddkPath = "$wdkPath\Include\10.0.22621.0\km\ntddk.h"
          if (Test-Path $ntddkPath) {
            Write-Host "✓ ntddk.h found at: $ntddkPath"
          } else {
            Write-Host "Searching for ntddk.h..."
            Get-ChildItem "$wdkPath\Include" -Recurse -Filter "ntddk.h" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
            }
          }
        } else {
          Write-Host "✗ WDK not found at expected location"
          exit 1
        }

    - name: Verify Build Prerequisites
      shell: powershell
      run: |
        Write-Host "Verifying build prerequisites..."
        
        $msbuild = Get-Command msbuild -ErrorAction SilentlyContinue
        if ($msbuild) {
          Write-Host "✓ MSBuild found: $($msbuild.Source)"
        } else {
          Write-Host "✗ MSBuild not found"
          exit 1
        }
        
        $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        if (Test-Path $vsPath) {
          Write-Host "✓ Visual Studio 2022 Enterprise found"
        } else {
          Write-Host "✗ Visual Studio 2022 Enterprise not found"
          exit 1
        }
        
        $wdkPath = "C:\Program Files (x86)\Windows Kits\10"
        if (Test-Path "$wdkPath\Include") {
          Write-Host "✓ Windows Kits found"
          Get-ChildItem "$wdkPath\Include" | ForEach-Object {
            Write-Host "  - $_"
          }
        }

    - name: Set Environment Variables
      shell: powershell
      run: |
        Write-Host "Setting environment variables..."
        
        $wdkPath = "C:\Program Files (x86)\Windows Kits\10"
        $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        
        [Environment]::SetEnvironmentVariable("WindowsSDKVersion", "10.0.22621.0", "Process")
        [Environment]::SetEnvironmentVariable("KIT_ROOT", $wdkPath, "Process")
        [Environment]::SetEnvironmentVariable("VS_PATH", $vsPath, "Process")
        
        Write-Host "Environment variables set:"
        Write-Host "  WindowsSDKVersion: 10.0.22621.0"
        Write-Host "  KIT_ROOT: $wdkPath"
        Write-Host "  VS_PATH: $vsPath"

    - name: Build Driver Solution
      shell: cmd
      run: |
        echo Building WinEPPFilter.sln...
        msbuild "WinEPPFilter-KMDF-Driver-Project\WinEPPFilter.sln" ^
          /p:Configuration=Release ^
          /p:Platform=x64 ^
          /p:WindowsTargetPlatformVersion=10.0.22621.0 ^
          /m ^
          /v:detailed
        
        if %ERRORLEVEL% neq 0 (
          echo Build failed with error code %ERRORLEVEL%
          exit /b %ERRORLEVEL%
        )
        echo Build completed successfully!

    - name: Verify Build Outputs
      shell: powershell
      run: |
        Write-Host "Verifying build outputs..."
        
        $sysFiles = @(Get-ChildItem -Path "WinEPPFilter-KMDF-Driver-Project" -Recurse -Filter "*.sys" -ErrorAction SilentlyContinue)
        $exeFiles = @(Get-ChildItem -Path "WinEPPFilter-KMDF-Driver-Project" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue)
        
        Write-Host "Driver files (.sys):"
        if ($sysFiles.Count -gt 0) {
          $sysFiles | ForEach-Object { Write-Host "  ✓ $_" }
        } else {
          Write-Host "  ⚠ No .sys files found"
        }
        
        Write-Host "Executable files (.exe):"
        if ($exeFiles.Count -gt 0) {
          $exeFiles | ForEach-Object { Write-Host "  ✓ $_" }
        } else {
          Write-Host "  ⚠ No .exe files found"
        }

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: WinEPPFilter-Build
        path: |
          WinEPPFilter-KMDF-Driver-Project/**/Release/**/*.sys
          WinEPPFilter-KMDF-Driver-Project/**/Release/**/*.exe
          WinEPPFilter-KMDF-Driver-Project/**/Release/**/*.pdb
        retention-days: 30

    - name: Build Summary
      shell: powershell
      run: |
        Write-Host "========================================="
        Write-Host "Build Summary"
        Write-Host "========================================="
        Write-Host "Configuration: Release"
        Write-Host "Platform: x64"
        Write-Host "SDK Version: 10.0.22621.0"
        Write-Host "Status: ✓ SUCCESS"
        Write-Host "========================================="
