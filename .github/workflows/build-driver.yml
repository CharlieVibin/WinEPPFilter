name: Build Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Windows Driver Kit
      run: |
        # Download and install WDK
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2271797"
        $installerPath = "C:\wdk_installer.exe"
        Write-Host "Downloading WDK..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $installerPath -UseBasicParsing
        
        Write-Host "Installing WDK..."
        & $installerPath /quiet /norestart | Out-Null
        
        # Wait for installation
        Start-Sleep -Seconds 120
        Write-Host "WDK Installation completed"

    - name: Build Driver and App
      run: |
        msbuild ./WinEPPFilter-KMDF-Driver-Project/WinEPPFilter.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:WindowsTargetPlatformVersion=10.0.22621.0 `
          /m

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: driver-build
        path: |
          WinEPPFilter-KMDF-Driver-Project/**/x64/Release/**/*.sys
          WinEPPFilter-KMDF-Driver-Project/**/x64/Release/**/*.exe
