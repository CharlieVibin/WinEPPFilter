name: Build Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup VSDevEnv
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Build
      run: |
        cd WinEPPFilter-KMDF-Driver-Project
        msbuild WinEPPFilter.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: WinEPPFilter-KMDF-Driver-Project/**/Release/**
