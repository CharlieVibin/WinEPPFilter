name: Build Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Windows 11 SDK
      shell: pwsh
      run: |
        Write-Host "Installing Windows 11 SDK..."
        winget install Microsoft.WindowsSDK.10.0.22621 -h --accept-source-agreements --accept-package-agreements
        Start-Sleep -Seconds 30

    - name: Install Windows Driver Kit
      shell: pwsh
      run: |
        Write-Host "Installing Windows Driver Kit..."
        winget install Microsoft.WindowsDriverKit.10.0.22621 -h --accept-source-agreements --accept-package-agreements
        Start-Sleep -Seconds 60

    - name: Build Driver
      shell: cmd
      run: |
        msbuild "WinEPPFilter-KMDF-Driver-Project\WinEPPFilter.sln" /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /m
        if errorlevel 1 exit /b 1

    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: WinEPPFilter-Build
        path: WinEPPFilter-KMDF-Driver-Project/**/Release/**
